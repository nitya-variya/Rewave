<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REWAVE pour - scrub test</title>
<style>
  html,body{margin:0;height:100%;background:#12261C;color:#F3EFE6;font:13px/1.4 system-ui,sans-serif;overflow:hidden}
  #ui{position:fixed;left:16px;right:16px;bottom:14px;display:flex;gap:12px;align-items:center;z-index:2}
  #ui input{flex:1}
  #hud{position:fixed;left:16px;top:12px;opacity:.8;z-index:2}
  canvas{display:block}
</style></head>
<body>
<div id="hud">REWAVE pour pipeline test &middot; <span id="info">loading…</span></div>
<div id="ui"><button id="play">play</button><input id="s" type="range" min="0" max="1" step="0.0005" value="0"><span id="pct">0%</span></div>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RewavePour } from './rewave_pour_player.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x12261C);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100); camera.position.set(0, 0, 7.4);
const key = new THREE.DirectionalLight(0xfffaee, 2.1); key.position.set(3.5, 4.5, 3.5); scene.add(key, new THREE.AmbientLight(0xf4efe6, 0.5));
const rim = new THREE.DirectionalLight(0x8C9A5B, 3.8); rim.position.set(-3.5, 3.5, -3.5); scene.add(rim);

const productGroup = new THREE.Group(); scene.add(productGroup);
const gltf = await new GLTFLoader().loadAsync('../../assets/rewave_bottle.opt.glb');
const root = gltf.scene; root.scale.setScalar(0.038); productGroup.add(root);
let cap, juice;
root.traverse(c => { if (!c.isMesh) return;
  if (c.name.includes('Cap')) { cap = c; c.material = new THREE.MeshStandardMaterial({ color: 0x12261C, roughness: .42 }); }
  else if (c.name.includes('Juice')) { juice = c; c.scale.set(.935, .985, .935); c.material = new THREE.MeshPhysicalMaterial({ color: 0x7EAA45, transmission: .86, ior: 1.345, roughness: .1, thickness: 2.8, transparent: true }); }
  else if (c.name.includes('BottlePlastic')) c.material = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: .98, roughness: .03, ior: 1.51, thickness: .35, transparent: true, depthWrite: false });
});
// floor line for reference
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 4), new THREE.MeshStandardMaterial({ color: 0x0D241A, roughness: .16 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, -7.6, 0); scene.add(floor);

const pour = new RewavePour({ THREE, scene, productGroup, capMesh: cap, juiceMesh: juice, rigUrl: './rewave_pour_rig.json', liquidUrl: './liquid_frames' });
await pour.load();
const $ = id => document.getElementById(id);
function set(p) { const st = pour.setProgress(p); camera.position.y = st.camY; camera.lookAt(0, st.camY, 0);
  $('pct').textContent = Math.round(p * 100) + '%'; $('info').textContent = 'frame ' + st.frame.toFixed(1) + ' / ' + pour.lastFrame; renderer.render(scene, camera); }
$('s').addEventListener('input', e => set(+e.target.value));
let playing = false, t0 = 0; $('play').onclick = () => { playing = !playing; t0 = performance.now() - $('s').value * 8000; };
(function loop() { if (playing) { const p = Math.min(1, (performance.now() - t0) / 8000); $('s').value = p; set(p); if (p >= 1) playing = false; } requestAnimationFrame(loop); })();
set(0);
window.__set = set;   // for automated screenshots
</script>
</body></html>
